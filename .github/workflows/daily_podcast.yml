name: Generate Daily Podcast

on: 
  workflow_dispatch:     

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-genai tavily-python

      - name: Run Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}   
        run: python generate.py

      - name: Commit audio en feed
        run: |
          git config --global user.name 'Podcast Bot'
          git config --global user.email 'bot@local'
          git add episode_* feed.xml covered_topics.json || true
          git commit -m "Nieuwe aflevering en geheugen bijgewerkt voor $(date +'%Y-%m-%d')" || exit 0
          git push
