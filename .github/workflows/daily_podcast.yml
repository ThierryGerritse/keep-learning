name: Generate Daily Podcast

on:
  schedule:
    - cron: '0 3 * * *' # Elke nacht om 04:00 uur NL tijd (het stilste uur)
  workflow_dispatch:     

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-genai tavily-python

      - name: Run Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}   
        run: python generate.py

      - name: Commit MP3 naar de feed
        run: |
          git config --global user.name 'Podcast Bot'
          git config --global user.email 'bot@local'
          git add episode_* feed.xml || true
          git commit -m "Aflevering voor $(date +'%Y-%m-%d')" || exit 0
          git push
